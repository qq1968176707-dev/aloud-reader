# 发布安装包到 GitHub Releases。
#
#   git tag v0.1.0 && git push origin v0.1.0     → 自动构建四个安装包并建 Release
#   （也可以在 Actions 页面手动跑，填一个版本号）
#
# 每个平台都在自己的机器上打包：Windows 的 NSIS 装不进 macOS，macOS 的签名也只有
# macOS 机器做得了，安卓则要 JDK + Android SDK（Linux runner 自带）。
# 桌面四个产物 = 两个平台 × 完整版(pro)/轻量版(lite)，外加一个安卓 APK。
# iPad 不在这里——它是 PWA，地址见 Release 说明。
name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.1.0），只用于手动触发时给 Release 起名'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # 完整版 + 轻量版，nsis 安装版和 portable 免安装版各一套
            commands: 'npm run dist:win && npm run dist:win:lite'
          - os: macos-latest
            name: macos
            # Apple Silicon 与 Intel 两种芯片都出一份
            commands: 'node scripts/dist.mjs --mac --arm64 --x64 && node scripts/dist.mjs --mac --lite --arm64 --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: 打包
        shell: bash
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          # 更新清单（latest*.yml / lite*.yml）和 blockmap 是给应用内自动更新用的：
          # Windows 的 electron-updater 读 yml 找安装包、用 blockmap 做差量下载。
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/lite*.yml
            release/*.blockmap
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 版本号写进 APK
        shell: bash
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # versionCode 必须是递增整数：用 0.1.2 -> 10002 的方式从版本号算出来。
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${CODE}/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      # ELECTRON_SKIP_BINARY_DOWNLOAD：安卓用不到 Electron，省 100MB
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # APK 里的页面从 https://localhost/ 提供，所以 base 用默认的 '/'
      - run: npm run build:web
      - run: npx cap sync android
      - name: 还原签名密钥
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没有配置 ANDROID_KEYSTORE_BASE64，将用 debug 签名打包（能装，但不能覆盖安装正式版）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aloud-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/aloud-release.jks" >> "$GITHUB_ENV"
      - name: 打 APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon
      - name: 按发布规则改名
        shell: bash
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/AloudReader-${VERSION}.apk"
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: release/*.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - name: 生成发布说明（模板在 .github/release-notes.md）
        shell: bash
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          sed -e "s#{{VERSION}}#${VERSION}#g" -e "s#{{BASE}}#${BASE}#g" \
            .github/release-notes.md > notes.md
          cat notes.md
      - name: 建 Release 并挂上安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: 逐读 Aloud Reader ${{ github.event.inputs.version || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes.md
