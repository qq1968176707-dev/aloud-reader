appId: com.aloudreader.app
productName: Aloud Reader
copyright: Copyright © 2026 qq1968176707-dev. All rights reserved.

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/{test,__tests__,docs,example,examples}/**'

# Native-free project: app code is bundled, runtime deps ship inside the asar.
asar: true

# macOS 补一个完整的 ad-hoc 签名（见脚本说明）；其它平台直接返回。
afterPack: scripts/after-pack.cjs

# 自动更新的来源（src/main/updater.ts）。有了它 electron-builder 才会生成
# latest.yml（Windows）/ latest-mac.yml；轻量版由 scripts/dist.mjs 改成 lite 频道，
# 生成 lite.yml，两个版本在同一个 Release 里互不覆盖。真正上传由 CI 做（--publish never）。
publish:
  provider: github
  owner: qq1968176707-dev
  repo: aloud-reader
  channel: latest

# Built-in TTS server scripts (the venv + model are installed beside them at runtime).
extraResources:
  - from: tts-server
    to: tts-server
    filter: ['*.py', '*.bat', '*.sh']

win:
  target:
    # nsis     = 安装版（开始菜单 + 桌面快捷方式）
    # portable = 免安装单文件 exe，双击直接跑
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

mac:
  # dmg = 拖进「应用程序」安装；zip = 解压即用
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # ALOUD_EDITION 由 scripts/dist.mjs 传入：pro=含声音克隆，lite=不含
  artifactName: AloudReader-${version}-${arch}-${env.ALOUD_EDITION}.${ext}
  category: public.app-category.books
  icon: build/icon.icns
  # 没有开发者证书：让 electron-builder 跳过签名，再由 afterPack 钩子给整个包做完整的
  # ad-hoc 签名（scripts/after-pack.cjs）。只写 null 不补签是不行的——封印是破的，
  # 别人下载后 macOS 会判「已损坏」，详见钩子里的说明。
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: 录制你的声音（声音克隆参考音频、阅读录音）需要使用麦克风。
  fileAssociations:
    - ext: [epub]
      name: EPUB 电子书
      role: Viewer
    - ext: [mobi, azw, azw3, prc]
      name: Kindle 电子书
      role: Viewer
    - ext: [aloudbook]
      name: Aloud 图书包
      role: Viewer

nsis:
  artifactName: AloudReader-${version}-${env.ALOUD_EDITION}-setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aloud Reader
  deleteAppDataOnUninstall: false
  language: '2052' # 简体中文安装界面

portable:
  artifactName: AloudReader-${version}-${env.ALOUD_EDITION}-portable.exe
  requestExecutionLevel: user
